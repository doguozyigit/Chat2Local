<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Chat2Local interface overview</title>
  <desc id="desc">An illustration using synthetic data. A ChatGPT chat selects the task-list folder, uses scoped tools and relevant skills, and saves a checkpoint for recovery.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f2ff"/>
      <stop offset="1" stop-color="#ecf7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1c3652" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8c9d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #183042; }
      .muted { fill: #637487; }
      .label { font-size: 14px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .heading { font-size: 21px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1040" height="620" rx="22" fill="url(#canvas)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="42" width="928" height="456" rx="18" fill="#fff" stroke="#d4dfe9"/>
    <path d="M74 42h892a18 18 0 0 1 18 18v48H56V60a18 18 0 0 1 18-18" fill="#f7f9fc"/>
    <circle cx="81" cy="75" r="5" fill="#c6d0da"/>
    <circle cx="99" cy="75" r="5" fill="#c6d0da"/>
    <circle cx="117" cy="75" r="5" fill="#c6d0da"/>
    <text x="148" y="83" class="heading">Chat2Local</text>
    <circle cx="837" cy="76" r="5" fill="#16a366"/>
    <text x="851" y="81" class="label muted">Connected</text>
    <line x1="56" y1="108" x2="984" y2="108" stroke="#dce5ec"/>
    <rect x="56" y="109" width="253" height="389" fill="#f8fafc"/>
    <line x1="309" y1="108" x2="309" y2="498" stroke="#dce5ec"/>
    <text x="80" y="145" class="label muted">CHATS</text>
    <rect x="72" y="163" width="221" height="80" rx="11" fill="#e7f0ff" stroke="#cfdef5"/>
    <text x="88" y="191" class="body" font-weight="650">Weekend tasks</text>
    <text x="88" y="218" class="label muted">Folder: task-list</text>
    <text x="80" y="286" class="label muted">CHATGPT CONNECTION</text>
    <circle cx="85" cy="313" r="4" fill="#16a366"/>
    <text x="98" y="318" class="body">Secure MCP Tunnel</text>
    <text x="80" y="449" class="small muted">Each chat chooses its own folder.</text>
    <text x="340" y="150" class="heading">Weekend tasks</text>
    <text x="340" y="179" class="body muted">ChatGPT can work in the folder you selected.</text>
    <rect x="340" y="201" width="613" height="78" rx="12" fill="#f8fafc" stroke="#dce5ec"/>
    <text x="360" y="227" class="label muted">SELECTED FOLDER</text>
    <path d="M362 244h12l4 4h19v13h-35z" fill="#8aa9cc"/>
    <text x="410" y="259" class="body" font-weight="600">task-list</text>
    <rect x="817" y="224" width="116" height="34" rx="7" fill="#fff" stroke="#ccd9e5"/>
    <text x="838" y="246" class="label">Change folder</text>
    <rect x="340" y="295" width="613" height="148" rx="12" fill="#fff" stroke="#dce5ec"/>
    <text x="360" y="324" class="label muted">SAVED CHECKPOINT</text>
    <circle cx="363" cy="351" r="4" fill="#16a366"/>
    <text x="376" y="356" class="body" font-weight="600">Task list saved and read back</text>
    <text x="360" y="384" class="body muted">Next: check keyboard controls and narrow layout.</text>
    <rect x="360" y="401" width="132" height="28" rx="6" fill="#e7f0ff"/>
    <text x="377" y="420" class="label" fill="#2460a7">View work log</text>
    <text x="340" y="474" class="small muted">Files · Search · Shell · Browser · Skills · Recovery</text>
  </g>
  <g>
    <rect x="74" y="524" width="188" height="48" rx="12" fill="#fff" stroke="#d4dfe9"/>
    <text x="102" y="554" class="body" font-weight="600">1. Ask in ChatGPT</text>
    <line x1="272" y1="548" x2="300" y2="548" stroke="#7b8c9d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="315" y="524" width="188" height="48" rx="12" fill="#fff" stroke="#d4dfe9"/>
    <text x="340" y="554" class="body" font-weight="600">2. Choose a folder</text>
    <line x1="513" y1="548" x2="541" y2="548" stroke="#7b8c9d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="556" y="524" width="188" height="48" rx="12" fill="#fff" stroke="#d4dfe9"/>
    <text x="584" y="554" class="body" font-weight="600">3. Use tools + skills</text>
    <line x1="754" y1="548" x2="782" y2="548" stroke="#7b8c9d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="797" y="524" width="169" height="48" rx="12" fill="#fff" stroke="#d4dfe9"/>
    <text x="817" y="554" class="body" font-weight="600">4. Save checkpoint</text>
    <text x="520" y="598" text-anchor="middle" class="small muted">Illustrative interface overview · Synthetic example data · Not a screenshot</text>
  </g>
</svg>
